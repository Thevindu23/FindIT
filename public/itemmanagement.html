<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Item Management | FindIT</title><link rel="stylesheet" href="css/itemmanagement.css"><link rel="stylesheet" href="css/common.css"><link rel="icon" href="data:,"></head><body><div class="dashboard-container"><aside class="sidebar"><a class="logo" href="index.html">FindIt</a><nav class="nav-menu" aria-label="Admin navigation"><a href="adminhome.html" class="nav-link">Dashboard</a><a href="itemmanagement.html" class="nav-link active" aria-current="page">Item Management</a><a href="bountymanagement.html" class="nav-link">Bounty Management</a></nav><p id="admin-name"></p><a href="index.html">Public website</a><button id="logout" class="logout" type="button">Logout</button></aside><main class="main-content"><header class="topbar"><h1>Item Management</h1></header><p id="message" class="message" role="status" aria-live="polite"></p><div id="admin-content" hidden><form id="filters" class="controls"><label>Search<input type="search" name="search" placeholder="Item or location" maxlength="150"></label><label>Status<select name="status"><option>All</option><option>Lost</option><option>Found</option><option>Claim Pending</option><option>Resolved</option></select></label><label>Category<select name="category" data-categories><option value="All">All</option></select></label><label>Sort<select name="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="reward">Highest reward</option></select></label><label class="check"><input type="checkbox" name="bounty">With reward</label><button class="primary" type="submit">Search</button></form><div class="table-scroll"><table><caption class="sr-only">Reported items</caption><thead><tr><th>Item name</th><th>Category</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead><tbody id="item-rows"></tbody></table></div><div id="pagination" class="pagination"></div><dialog id="edit-dialog" aria-labelledby="edit-heading"><h2 id="edit-heading">Edit report</h2><p id="edit-message" class="message" role="status"></p><form id="edit-form" class="edit-form"><div class="form-group"><label for="title">Item name</label><input id="title" name="title" required maxlength="150"></div><div class="form-group"><label for="category">Category</label><select id="category" name="category" data-categories required><option value="">Select a category</option></select></div><div class="form-group"><label for="status">Report type</label><select id="status" name="status"><option>Lost</option><option>Found</option></select></div><div class="form-group"><label for="dateReported">Date lost / found</label><input id="dateReported" name="dateReported" type="date" required min="1900-01-01"></div><div class="form-group"><label for="location">Location</label><input id="location" name="location" required maxlength="255" placeholder="e.g. Colombo Fort"></div><div class="form-group"><label for="reporterContact">Contact phone or email</label><input id="reporterContact" name="reporterContact" required maxlength="254"></div><div class="form-group full-width"><label for="description">Description</label><textarea id="description" name="description" rows="4" required minlength="10" maxlength="4000"></textarea></div><div class="form-group"><label for="rewardAmount">Reward (LKR, optional)</label><input id="rewardAmount" name="rewardAmount" type="number" min="0" max="99999999.99" step="0.01" value="0"></div><div class="form-group"><label for="imageUpload">Image (PNG, JPEG or WebP; up to 1 MB)</label><input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp"><img id="image-preview" class="preview" alt="Selected item image" hidden></div><div class="form-actions"><button type="button" id="close-editor">Cancel</button><button type="submit" class="primary">Save changes</button></div></form></dialog></div></main></div><script src="js/common.js" defer></script><script src="js/admin-common.js" defer></script><script src="js/itemmanagement.js" defer></script></body></html>
