<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Report an item | FindIT</title><link rel="stylesheet" href="css/report.css"><link rel="stylesheet" href="css/common.css"><link rel="icon" href="data:,"></head><body><main class="report-form-container"><a href="index.html">Back to FindIT</a><h1>Report a lost or found item</h1><p>Include enough detail to help someone recognize it. Your contact details are visible to signed-in users.</p><p id="message" class="message" role="status" aria-live="polite"></p><form id="lostItemForm" hidden><div class="form-group"><label for="title">Item name</label><input id="title" name="title" required maxlength="150"></div><div class="form-group"><label for="category">Category</label><select id="category" name="category" data-categories required><option value="">Select a category</option></select></div><div class="form-group"><label for="status">Report type</label><select id="status" name="status"><option>Lost</option><option>Found</option></select></div><div class="form-group"><label for="dateReported">Date lost / found</label><input id="dateReported" name="dateReported" type="date" required min="1900-01-01"></div><div class="form-group"><label for="location">Location</label><input id="location" name="location" required maxlength="255" placeholder="e.g. Colombo Fort"></div><div class="form-group"><label for="reporterContact">Contact phone or email</label><input id="reporterContact" name="reporterContact" required maxlength="254"></div><div class="form-group full-width"><label for="description">Description</label><textarea id="description" name="description" rows="4" required minlength="10" maxlength="4000"></textarea></div><div class="form-group"><label for="rewardAmount">Reward (LKR, optional)</label><input id="rewardAmount" name="rewardAmount" type="number" min="0" max="99999999.99" step="0.01" value="0"></div><div class="form-group"><label for="imageUpload">Image (PNG, JPEG or WebP; up to 1 MB)</label><input id="imageUpload" type="file" accept="image/png,image/jpeg,image/webp"><img id="image-preview" class="preview" alt="Selected item image" hidden></div><div class="form-actions"><a class="btn cancel-btn" href="index.html">Cancel</a><button class="btn submit-btn" type="submit">Submit report</button></div></form></main><script src="js/common.js" defer></script><script src="js/script1.js" defer></script></body></html>
