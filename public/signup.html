<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create an account | FindIT</title><link rel="stylesheet" href="css/adminlogin.css"><link rel="stylesheet" href="css/common.css"><link rel="icon" href="data:,"></head><body><main class="login-container"><a class="logo" href="index.html">FindIt</a><h1>Create an account</h1><p>Join the lost-and-found community.</p><p id="message" class="message" role="status" aria-live="polite"></p><form id="login-form" data-register="true"><div class="input-group"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required minlength="2" maxlength="100"></div><div class="input-group"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254"></div><div class="input-group"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="72"><button id="show-password" class="text-button" type="button" aria-pressed="false">Show password</button></div><button class="login-btn" type="submit">Create account</button></form><p>Already registered? <a href="adminlogin.html">Login</a></p><a href="index.html">Back to home</a></main><script src="js/common.js" defer></script><script src="js/adminlogin.js" defer></script></body></html>
